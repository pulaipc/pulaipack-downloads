<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" role="img" aria-labelledby="title desc">
  <title id="title">pulaipack by PULAI PC</title>
  <desc id="desc">Gold handheld console with a firmware boot screen beside the pulaipack wordmark.</desc>
  <rect width="860" height="210" rx="22" fill="#11110e"/>

  <g transform="translate(62 67)">
    <rect width="180" height="76" rx="9" fill="#ffbf00"/>
    <path d="M33 2v72M147 2v72" stroke="#b58400" stroke-width="1.5" opacity=".75"/>
    <rect x="37" y="6" width="106" height="64" rx="3" fill="#11110e"/>
    <rect x="42" y="11" width="96" height="54" fill="#1a1914"/>

    <!-- Left controller: stick and directional pad. -->
    <circle cx="16" cy="23" r="7" fill="#11110e"/>
    <circle cx="16" cy="23" r="3.5" fill="#302b1b"/>
    <path d="M16 42v18m-9-9h18" stroke="#11110e" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Right controller: face buttons and stick. -->
    <circle cx="163" cy="20" r="2.8" fill="#11110e"/>
    <circle cx="171" cy="27" r="2.8" fill="#11110e"/>
    <circle cx="155" cy="27" r="2.8" fill="#11110e"/>
    <circle cx="163" cy="34" r="2.8" fill="#11110e"/>
    <circle cx="163" cy="56" r="5" fill="#11110e"/>

    <!-- Firmware boot / update display. -->
    <text x="55" y="34" fill="#ffbf00" font-family="monospace" font-size="11" font-weight="700">&gt;_</text>
    <path d="M74 32h45M55 41h64M55 49h38" stroke="#ffbf00" stroke-width="2" stroke-linecap="round"/>
    <rect x="55" y="55" width="64" height="4" rx="2" fill="#53451d"/>
    <rect x="55" y="55" width="43" height="4" rx="2" fill="#ffbf00"/>
  </g>

  <text x="294" y="115" fill="#f5f1e6" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="600" letter-spacing=".2">pulai</text>
  <text x="458" y="115" fill="#ffbf00" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.7">pack</text>
  <text x="535" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing=".3">
    <tspan fill="#aaa592" font-weight="500">by </tspan><tspan fill="#f5f1e6" font-weight="700" letter-spacing="1">PULAI</tspan><tspan fill="#ffbf00" font-weight="800" letter-spacing=".3"> PC</tspan>
  </text>
</svg>
